<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#0f1115; --panel:#191c22; --panel2:#22262e; --line:#2c313b;
    --txt:#f2f4f8; --muted:#9aa3b2; --accent:#e85d2a; --ok:#2ab07a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--txt); padding-bottom:40px;}
  .wrap{max-width:560px; margin:0 auto; padding:16px;}
  header{position:sticky; top:0; background:rgba(15,17,21,.92); backdrop-filter:blur(6px);
    z-index:10; padding:12px 16px; border-bottom:1px solid var(--line); display:flex;
    align-items:center; gap:10px; min-height:56px;}
  header .back{font-size:22px; cursor:pointer; color:var(--muted); width:28px;}
  header h1{font-size:17px; margin:0; font-weight:700; flex:1; line-height:1.2;}
  .badge{font-size:12px; background:var(--panel2); padding:5px 10px; border-radius:20px; color:var(--muted);}
  h2{font-size:15px; color:var(--muted); font-weight:600; margin:18px 2px 10px; text-transform:uppercase; letter-spacing:.5px;}
  .screen{display:none; animation:fade .25s ease;}
  .screen.active{display:block;}
  @keyframes fade{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}

  .btn{display:block; width:100%; border:none; border-radius:14px; padding:16px;
    font-size:16px; font-weight:700; cursor:pointer; margin-top:12px;}
  .btn-primary{background:var(--accent); color:#fff;}
  .btn-ok{background:var(--ok); color:#fff;}
  .btn-ghost{background:var(--panel2); color:var(--txt);}
  .btn:active{transform:scale(.98);}

  .grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:16px;
    overflow:hidden; cursor:pointer; transition:border-color .15s;}
  .card:active{border-color:var(--accent);}
  .card .img{height:96px; background:var(--panel2) center/cover no-repeat;
    display:flex; align-items:center; justify-content:center; font-size:34px;}
  .card .name{padding:12px; font-weight:700; font-size:15px;}

  .user-card{display:flex; align-items:center; gap:14px; background:var(--panel);
    border:1px solid var(--line); border-radius:16px; padding:16px; margin-top:12px; cursor:pointer;}
  .avatar{width:46px; height:46px; border-radius:50%; display:flex; align-items:center;
    justify-content:center; font-weight:800; color:#fff; font-size:18px; flex-shrink:0;}

  .hint{background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--accent);
    border-radius:12px; padding:14px; font-size:14px; color:var(--muted); margin-top:4px;}
  .hint b{color:var(--txt);}
  .hint .big{font-size:22px; color:var(--accent); font-weight:800;}

  table{width:100%; border-collapse:collapse; margin-top:10px;}
  th,td{padding:10px 8px; text-align:center; font-size:14px; border-bottom:1px solid var(--line);}
  th{color:var(--muted); font-size:12px; text-transform:uppercase;}
  .inputs{display:grid; grid-template-columns:40px 1fr 1fr; gap:8px; align-items:center; margin-top:14px;}
  .inputs label{font-size:12px; color:var(--muted); text-align:center;}
  input[type=number]{width:100%; background:var(--panel2); border:1px solid var(--line);
    border-radius:10px; color:var(--txt); padding:14px 8px; font-size:17px; text-align:center;}
  input:focus{outline:none; border-color:var(--accent);}
  .serie-tag{display:inline-flex; width:30px; height:30px; background:var(--accent);
    border-radius:50%; align-items:center; justify-content:center; font-weight:800; font-size:13px;}
  .empty{color:var(--muted); text-align:center; padding:24px; font-size:14px;}
  .spin{text-align:center; color:var(--muted); padding:30px;}

  .toast{position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(80px);
    background:var(--ok); color:#fff; padding:14px 22px; border-radius:30px; font-weight:700;
    font-size:15px; opacity:0; transition:all .3s; z-index:50; box-shadow:0 6px 20px rgba(0,0,0,.45);}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .modal{position:fixed; inset:0; background:rgba(0,0,0,.65); display:none; align-items:center;
    justify-content:center; z-index:40; padding:24px;}
  .modal.show{display:flex;}
  .modal-box{background:var(--panel); border:1px solid var(--line); border-radius:18px;
    padding:24px; max-width:360px; width:100%; text-align:center;}
  .modal-box p{font-size:17px; margin:0 0 20px; line-height:1.4;}
  .modal-row{display:flex; gap:10px;}
  .modal-row .btn{margin-top:0;}

  /* Informes / Progreso */
  .toggle{display:flex; gap:8px; margin-bottom:6px;}
  .toggle button{flex:1; padding:12px; border:1px solid var(--line); border-radius:12px;
    background:var(--panel); color:var(--muted); font-weight:700; cursor:pointer; font-size:14px;}
  .toggle button.on{background:var(--accent); color:#fff; border-color:var(--accent);}
  .row-item{display:flex; justify-content:space-between; align-items:center; background:var(--panel);
    border:1px solid var(--line); border-radius:12px; padding:14px; margin-top:10px; cursor:pointer;}
  .row-item:active{border-color:var(--accent);}
  .row-item .meta{font-size:12px; color:var(--muted);}
  select{width:100%; background:var(--panel2); border:1px solid var(--line); border-radius:10px;
    color:var(--txt); padding:13px; font-size:15px; margin-top:8px;}
  .chart-box{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:14px; margin-top:14px;}
  .chart-box h3{margin:0 0 6px; font-size:14px; color:var(--muted); font-weight:600;}
  .dl-row{display:flex; gap:10px; margin-top:16px;}
  .dl-row .btn{margin-top:0;}
</style>
</head>
<body>

<header>
  <span class="back" id="btnBack" onclick="atras()" style="display:none">‹</span>
  <h1 id="titulo">Entrenamientos</h1>
  <span class="badge" id="userBadge" style="display:none"></span>
</header>

<div class="wrap">

  <!-- 1. USUARIOS -->
  <section id="s-usuarios" class="screen active">
    <h2>¿Quién entrena hoy?</h2>
    <div id="listaUsuarios"><div class="spin">Cargando…</div></div>
  </section>

  <!-- 2. HOME -->
  <section id="s-home" class="screen">
    <h2>Inicio</h2>
    <button class="btn btn-primary" onclick="irGrupos()">🏋️ Iniciar entrenamiento</button>
    <button class="btn btn-ghost" onclick="irProgreso()">📈 Progreso (gráficas)</button>
    <button class="btn btn-ghost" onclick="irInformes()">📄 Informes (PDF / Excel)</button>
  </section>

  <!-- 3. GRUPOS -->
  <section id="s-grupos" class="screen">
    <h2>Elige grupo muscular</h2>
    <div class="grid" id="listaGrupos"></div>
  </section>

  <!-- 4. EJERCICIOS -->
  <section id="s-ejercicios" class="screen">
    <h2 id="tituloGrupo">Ejercicios</h2>
    <div class="grid" id="listaEjercicios"></div>
    <button class="btn btn-ok" style="margin-top:22px" onclick="finEntrenamiento()">✅ Fin del entrenamiento</button>
  </section>

  <!-- 5. EJERCICIO -->
  <section id="s-ejercicio" class="screen">
    <h2 id="tituloEjercicio">Ejercicio</h2>
    <div id="recordatorio"></div>
    <table>
      <thead><tr><th>Serie</th><th>Peso (kg)</th><th>Reps</th></tr></thead>
      <tbody id="tablaSeries">
        <tr><td colspan="3" class="empty">Aún no has añadido series</td></tr>
      </tbody>
    </table>
    <div class="inputs">
      <div style="text-align:center"><span class="serie-tag" id="numSerie">1</span></div>
      <div><label>Peso</label><input type="number" id="inPeso" inputmode="decimal" placeholder="0"></div>
      <div><label>Reps</label><input type="number" id="inReps" inputmode="numeric" placeholder="0"></div>
    </div>
    <button class="btn btn-primary" onclick="anadirSerie()">➕ Añadir serie</button>
    <button class="btn btn-ghost" onclick="finalizarEjercicio()">Finalizar ejercicio</button>
  </section>

  <!-- 6. INFORMES -->
  <section id="s-informes" class="screen">
    <h2>Informes</h2>
    <div class="toggle">
      <button id="tgEntreno" class="on" onclick="cambiarTipoInforme('entreno')">Por entrenamiento</button>
      <button id="tgDia" onclick="cambiarTipoInforme('dia')">Por día</button>
    </div>
    <div id="listaInformes"><div class="spin">Cargando…</div></div>
  </section>

  <!-- 7. DETALLE INFORME -->
  <section id="s-informe-det" class="screen">
    <h2 id="tituloInforme">Informe</h2>
    <div id="previewInforme"></div>
    <div class="dl-row">
      <button class="btn btn-primary" onclick="descargarInforme('pdf')">⬇️ PDF</button>
      <button class="btn btn-ok" onclick="descargarInforme('excel')">⬇️ Excel</button>
    </div>
  </section>

  <!-- 8. PROGRESO -->
  <section id="s-progreso" class="screen">
    <h2>Progreso</h2>
    <select id="selGrupoProg" onchange="cargarEjerciciosProg()"><option value="">Elige grupo…</option></select>
    <select id="selEjercicioProg" onchange="cargarGraficas()"><option value="">Elige ejercicio…</option></select>
    <div id="zonaGraficas"></div>
  </section>

</div>

<!-- Avisos propios -->
<div class="modal" id="modal">
  <div class="modal-box">
    <p id="modalMsg"></p>
    <div class="modal-row">
      <button class="btn btn-ghost" onclick="cerrarModal(false)">Cancelar</button>
      <button class="btn btn-ok" onclick="cerrarModal(true)">Aceptar</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
  const estado = { usuario:null, grupo:null, entreno:null, ejercicio:null, serieNum:1,
                   tipoInforme:'entreno', informeSel:null, detalleActual:null };
  let DATOS = { usuarios:[], grupos:[] };
  let chartPeso=null, chartVol=null;

  /* ---- Avisos propios ---- */
  let _modalCb = null;
  function confirmar(msg, cb){
    _modalCb = cb;
    document.getElementById('modalMsg').textContent = msg;
    document.getElementById('modal').classList.add('show');
  }
  function cerrarModal(ok){
    document.getElementById('modal').classList.remove('show');
    const cb = _modalCb; _modalCb = null;
    if(ok && cb) cb();
  }
  function toast(msg, tipo){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.background = (tipo==='err') ? 'var(--accent)' : 'var(--ok)';
    t.classList.add('show');
    setTimeout(function(){ t.classList.remove('show'); }, 2300);
  }

  /* ---- Navegación ---- */
  const TITULOS = {
    's-usuarios':'Entrenamientos', 's-home':'Inicio', 's-grupos':'Grupo muscular',
    's-ejercicios':'Ejercicios', 's-ejercicio':'Ejercicio', 's-informes':'Informes',
    's-informe-det':'Informe', 's-progreso':'Progreso'
  };
  const VUELVE = {
    's-home':'irUsuarios', 's-grupos':'irHome', 's-ejercicios':'irGrupos',
    's-ejercicio':'irEjercicios', 's-informes':'irHome', 's-informe-det':'irInformes',
    's-progreso':'irHome'
  };
  function mostrar(id, titulo, back){
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    document.getElementById('titulo').textContent = titulo || TITULOS[id] || '';
    document.getElementById('btnBack').style.display = back ? 'block' : 'none';
    window.scrollTo(0,0);
  }
  function atras(){
    const actual = document.querySelector('.screen.active').id;
    const fn = VUELVE[actual];
    if(fn) window[fn]();
  }

  /* ---- Carga inicial ---- */
  google.script.run
    .withSuccessHandler(function(d){ DATOS = d; renderUsuarios(); })
    .withFailureHandler(function(err){
      document.getElementById('listaUsuarios').innerHTML =
        '<div class="hint" style="border-left-color:var(--accent); color:var(--txt)">'+
        '⚠️ <b>No se pudo cargar.</b><br><br>'+ (err && err.message ? err.message : err) +
        '<br><br>Ejecuta la función <b>setup</b> una vez en el editor y vuelve a implementar una <b>nueva versión</b>.</div>';
    })
    .getDatosIniciales();

  function renderUsuarios(){
    const cont = document.getElementById('listaUsuarios');
    cont.innerHTML = '';
    DATOS.usuarios.forEach(function(u){
      const ini = u.nombre.trim().charAt(0).toUpperCase();
      const div = document.createElement('div');
      div.className='user-card';
      div.innerHTML = '<div class="avatar" style="background:'+u.color+'">'+ini+'</div>'+
                      '<div style="font-weight:700;font-size:16px">'+u.nombre+'</div>';
      div.onclick = function(){ seleccionarUsuario(u); };
      cont.appendChild(div);
    });
  }
  function seleccionarUsuario(u){
    estado.usuario = u;
    const b = document.getElementById('userBadge');
    b.style.display='inline-block'; b.textContent = u.nombre;
    irHome();
  }
  function irUsuarios(){ document.getElementById('userBadge').style.display='none'; mostrar('s-usuarios','Entrenamientos',false); }
  function irHome(){ mostrar('s-home', estado.usuario.nombre, true); }

  /* ---- Grupos ---- */
  function irGrupos(){
    const cont = document.getElementById('listaGrupos');
    cont.innerHTML='';
    DATOS.grupos.forEach(function(g){
      const card = document.createElement('div');
      card.className='card';
      const img = g.imagen
        ? '<div class="img" style="background-image:url(\''+g.imagen+'\')"></div>'
        : '<div class="img">💪</div>';
      card.innerHTML = img + '<div class="name">'+g.nombre+'</div>';
      card.onclick = function(){ seleccionarGrupo(g); };
      cont.appendChild(card);
    });
    mostrar('s-grupos','Grupo muscular', true);
  }
  function seleccionarGrupo(g){
    estado.grupo = g;
    google.script.run.withSuccessHandler(function(id){
      estado.entreno = id;
      cargarEjercicios();
    }).iniciarEntrenamiento(estado.usuario.id, g.id);
  }

  /* ---- Ejercicios ---- */
  function cargarEjercicios(){
    document.getElementById('tituloGrupo').textContent = estado.grupo.nombre;
    const cont = document.getElementById('listaEjercicios');
    cont.innerHTML = '<div class="spin">Cargando…</div>';
    mostrar('s-ejercicios', estado.grupo.nombre, true);
    google.script.run.withSuccessHandler(function(lista){
      cont.innerHTML='';
      if(!lista.length){ cont.innerHTML='<div class="empty">No hay ejercicios en este grupo</div>'; return; }
      lista.forEach(function(e){
        const card = document.createElement('div');
        card.className='card';
        const img = e.imagen
          ? '<div class="img" style="background-image:url(\''+e.imagen+'\')"></div>'
          : '<div class="img">🏋️</div>';
        card.innerHTML = img + '<div class="name">'+e.nombre+'</div>';
        card.onclick = function(){ abrirEjercicio(e); };
        cont.appendChild(card);
      });
    }).getEjercicios(estado.grupo.id);
  }
  function irEjercicios(){ mostrar('s-ejercicios', estado.grupo.nombre, true); }

  /* ---- Ejercicio ---- */
  function abrirEjercicio(e){
    estado.ejercicio = e;
    estado.serieNum = 1;
    document.getElementById('tituloEjercicio').textContent = e.nombre;
    document.getElementById('recordatorio').innerHTML = '<div class="spin">Buscando historial…</div>';
    document.getElementById('tablaSeries').innerHTML =
      '<tr><td colspan="3" class="empty">Aún no has añadido series</td></tr>';
    document.getElementById('inPeso').value='';
    document.getElementById('inReps').value='';
    document.getElementById('numSerie').textContent='1';
    mostrar('s-ejercicio', e.nombre, true);
    google.script.run.withSuccessHandler(renderRecordatorio)
      .getHistorialEjercicio(estado.usuario.id, e.id);
  }
  function renderRecordatorio(h){
    const cont = document.getElementById('recordatorio');
    if(!h.hayHistorial){
      cont.innerHTML = '<div class="hint">Primera vez que registras este ejercicio. ¡A por él! 🔥</div>';
      return;
    }
    const pesos = h.seriesUltimas.map(function(s){ return s.peso+'kg×'+s.reps; }).join(' · ');
    cont.innerHTML =
      '<div class="hint">'+
        '📅 Último día: <b>'+formatearFecha(h.ultimaFecha)+'</b><br>'+
        '🔁 Ese día: <b>'+pesos+'</b><br>'+
        '⚖️ Peso medio histórico: <span class="big">'+h.pesoMedio+' kg</span>'+
      '</div>';
  }
  function anadirSerie(){
    const peso = document.getElementById('inPeso').value;
    const reps = document.getElementById('inReps').value;
    if(peso==='' || reps===''){ toast('Rellena peso y repeticiones', 'err'); return; }
    const n = estado.serieNum;
    google.script.run.guardarSerie(estado.entreno, estado.ejercicio.id, n, peso, reps);
    const tbody = document.getElementById('tablaSeries');
    if(n===1) tbody.innerHTML='';
    const tr = document.createElement('tr');
    tr.innerHTML = '<td><span class="serie-tag">'+n+'</span></td><td>'+peso+'</td><td>'+reps+'</td>';
    tbody.appendChild(tr);
    estado.serieNum++;
    document.getElementById('numSerie').textContent = estado.serieNum;
    document.getElementById('inReps').value='';
    document.getElementById('inPeso').focus();
  }
  function finalizarEjercicio(){ cargarEjercicios(); }
  function finEntrenamiento(){
    confirmar('¿Finalizar el entrenamiento de '+estado.grupo.nombre+'?', function(){
      google.script.run.withSuccessHandler(function(){
        toast('Entrenamiento guardado ✅');
        irHome();
      }).finalizarEntrenamiento(estado.entreno);
    });
  }

  /* ================= INFORMES ================= */
  function irInformes(){ estado.tipoInforme='entreno'; cambiarTipoInforme('entreno'); mostrar('s-informes', null, true); }
  function cambiarTipoInforme(tipo){
    estado.tipoInforme = tipo;
    document.getElementById('tgEntreno').classList.toggle('on', tipo==='entreno');
    document.getElementById('tgDia').classList.toggle('on', tipo==='dia');
    const cont = document.getElementById('listaInformes');
    cont.innerHTML = '<div class="spin">Cargando…</div>';
    if(tipo==='entreno'){
      google.script.run.withSuccessHandler(function(lista){
        if(!lista.length){ cont.innerHTML='<div class="empty">Aún no hay entrenamientos</div>'; return; }
        cont.innerHTML='';
        lista.forEach(function(e){
          const dur = e.duracion!=null ? e.duracion+' min' : 'sin finalizar';
          const div = document.createElement('div');
          div.className='row-item';
          div.innerHTML = '<div><b>'+e.grupo+'</b><div class="meta">'+formatearFecha(e.fecha)+'</div></div>'+
                          '<div class="meta">'+dur+'</div>';
          div.onclick = function(){ abrirInforme('entreno', e.id, e.grupo+' · '+formatearFecha(e.fecha)); };
          cont.appendChild(div);
        });
      }).getEntrenamientosUsuario(estado.usuario.id);
    } else {
      google.script.run.withSuccessHandler(function(fechas){
        if(!fechas.length){ cont.innerHTML='<div class="empty">Aún no hay entrenamientos</div>'; return; }
        cont.innerHTML='';
        fechas.forEach(function(f){
          const div = document.createElement('div');
          div.className='row-item';
          div.innerHTML = '<div><b>'+formatearFecha(f)+'</b></div><div class="meta">ver día ›</div>';
          div.onclick = function(){ abrirInforme('dia', f, 'Día '+formatearFecha(f)); };
          cont.appendChild(div);
        });
      }).getFechasUsuario(estado.usuario.id);
    }
  }
  function abrirInforme(tipo, id, titulo){
    estado.informeSel = { tipo:tipo, id:id };
    estado.detalleActual = null;
    document.getElementById('tituloInforme').textContent = titulo;
    document.getElementById('previewInforme').innerHTML = '<div class="spin">Preparando…</div>';
    mostrar('s-informe-det', null, true);
    const cb = function(d){ estado.detalleActual = d; renderPreview(tipo, d); };
    if(tipo==='entreno') google.script.run.withSuccessHandler(cb).getDetalleEntrenamiento(id);
    else google.script.run.withSuccessHandler(cb).getDetalleDia(estado.usuario.id, id);
  }
  function renderPreview(tipo, d){
    const cont = document.getElementById('previewInforme');
    function tablaEj(ej){
      const filas = ej.series.map(function(s){ return '<tr><td>'+s.serie+'</td><td>'+s.peso+'</td><td>'+s.reps+'</td></tr>'; }).join('');
      return '<div style="margin-top:10px;font-weight:700">'+ej.ejercicio+' <span class="meta">('+ej.volumen+' kg)</span></div>'+
             '<table><tr><th>Serie</th><th>Peso</th><th>Reps</th></tr>'+filas+'</table>';
    }
    if(tipo==='entreno'){
      cont.innerHTML = '<div class="hint">'+d.inicio+'–'+d.fin+' · '+(d.duracion!=null?d.duracion+' min':'-')+'</div>'+
                       d.ejercicios.map(tablaEj).join('');
    } else {
      cont.innerHTML = d.entrenos.map(function(e){
        return '<h2>'+e.grupo+'</h2>'+e.ejercicios.map(tablaEj).join('');
      }).join('') || '<div class="empty">Sin datos ese día</div>';
    }
  }
  function descargarInforme(formato){
    if(formato==='pdf'){
      toast('Generando PDF…');
      const s = estado.informeSel;
      google.script.run
        .withSuccessHandler(descargarBlob)
        .withFailureHandler(function(e){ toast('Error al generar PDF','err'); })
        .generarInformePDF(s.tipo, s.id, estado.usuario.id);
    } else {
      descargarExcel();
    }
  }

  /* ---- Descargas ---- */
  function descargarBlob(obj){
    try{
      const bin = atob(obj.b64);
      const arr = new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
      lanzarDescarga(new Blob([arr], {type:obj.mime}), obj.nombre);
    }catch(e){ toast('No se pudo descargar','err'); }
  }
  function descargarExcel(){
    const d = estado.detalleActual;
    if(!d){ toast('Espera a que cargue','err'); return; }
    const sep=';';
    let filas=[['Fecha','Grupo','Ejercicio','Serie','Peso (kg)','Reps']];
    function volcar(entreno){
      entreno.ejercicios.forEach(function(ej){
        ej.series.forEach(function(s){
          filas.push([entreno.fecha, entreno.grupo, ej.ejercicio, s.serie,
                      String(s.peso).replace('.',','), s.reps]);
        });
      });
    }
    let nombre;
    if(estado.informeSel.tipo==='entreno'){ volcar(d); nombre='Entrenamiento_'+d.grupo+'_'+d.fecha+'.csv'; }
    else { d.entrenos.forEach(volcar); nombre='Dia_'+d.fecha+'.csv'; }
    const csv = '\uFEFF' + filas.map(function(r){ return r.join(sep); }).join('\r\n');
    lanzarDescarga(new Blob([csv], {type:'text/csv;charset=utf-8'}), nombre);
  }
  function lanzarDescarga(blob, nombre){
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href=url; a.download=nombre;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 1500);
    toast('Descargando '+nombre.split('.').pop().toUpperCase());
  }

  /* ================= PROGRESO ================= */
  function irProgreso(){
    const sel = document.getElementById('selGrupoProg');
    sel.innerHTML = '<option value="">Elige grupo…</option>';
    DATOS.grupos.forEach(function(g){ sel.innerHTML += '<option value="'+g.id+'">'+g.nombre+'</option>'; });
    document.getElementById('selEjercicioProg').innerHTML = '<option value="">Elige ejercicio…</option>';
    document.getElementById('zonaGraficas').innerHTML = '';
    mostrar('s-progreso', null, true);
  }
  function cargarEjerciciosProg(){
    const gid = document.getElementById('selGrupoProg').value;
    const sel = document.getElementById('selEjercicioProg');
    sel.innerHTML = '<option value="">Cargando…</option>';
    document.getElementById('zonaGraficas').innerHTML = '';
    if(!gid){ sel.innerHTML='<option value="">Elige ejercicio…</option>'; return; }
    google.script.run.withSuccessHandler(function(lista){
      sel.innerHTML = '<option value="">Elige ejercicio…</option>';
      lista.forEach(function(e){ sel.innerHTML += '<option value="'+e.id+'">'+e.nombre+'</option>'; });
    }).getEjercicios(gid);
  }
  function cargarGraficas(){
    const ejId = document.getElementById('selEjercicioProg').value;
    const zona = document.getElementById('zonaGraficas');
    if(!ejId){ zona.innerHTML=''; return; }
    zona.innerHTML = '<div class="spin">Cargando datos…</div>';
    google.script.run.withSuccessHandler(renderGraficas).getProgresoEjercicio(estado.usuario.id, ejId);
  }
  function renderGraficas(datos){
    const zona = document.getElementById('zonaGraficas');
    if(!datos.length){ zona.innerHTML='<div class="empty">Sin registros de este ejercicio todavía</div>'; return; }
    zona.innerHTML =
      '<div class="chart-box"><h3>⚖️ Peso por sesión (kg)</h3><canvas id="cPeso" height="200"></canvas></div>'+
      '<div class="chart-box"><h3>📦 Volumen por sesión (peso × reps)</h3><canvas id="cVol" height="200"></canvas></div>';
    const labels = datos.map(function(d){ return formatearFecha(d.fecha); });
    const acc = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
    const ok  = getComputedStyle(document.documentElement).getPropertyValue('--ok').trim();
    const gridC = 'rgba(255,255,255,.07)';
    const opts = { responsive:true, plugins:{legend:{labels:{color:'#9aa3b2'}}},
      scales:{ x:{ticks:{color:'#9aa3b2'},grid:{color:gridC}}, y:{ticks:{color:'#9aa3b2'},grid:{color:gridC}} } };
    if(chartPeso) chartPeso.destroy();
    if(chartVol) chartVol.destroy();
    chartPeso = new Chart(document.getElementById('cPeso'), { type:'line',
      data:{ labels:labels, datasets:[
        { label:'Peso máx', data:datos.map(d=>d.pesoMax), borderColor:acc, backgroundColor:acc, tension:.3 },
        { label:'Peso medio', data:datos.map(d=>d.pesoMedio), borderColor:ok, backgroundColor:ok, tension:.3 }
      ]}, options:opts });
    chartVol = new Chart(document.getElementById('cVol'), { type:'bar',
      data:{ labels:labels, datasets:[{ label:'Volumen (kg)', data:datos.map(d=>d.volumen), backgroundColor:acc }]},
      options:opts });
  }

  /* ---- Utilidad ---- */
  function formatearFecha(f){
    try{ const p = String(f).split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }catch(e){ return f; }
  }
</script>
